[package]
name = "ashfall_core"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
